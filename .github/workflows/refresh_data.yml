name: Refresh OpenSooq data

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape and process listings
        run: python scripts/refresh_data.py --max-pages 50 --page-delay 2

      - name: Commit updated processed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/listings.parquet data/processed/metadata.json data/raw/listings_*.csv
          git diff --staged --quiet || git commit -m "chore: refresh OpenSooq listings [skip ci]"
          git push
